<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:18px 20px;">
  <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Light theme</div>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;">
    <div style="text-align:center;"><div style="height:48px;background:#0b1220;border-radius:8px;"></div><div style="font:600 11px 'Inter';color:#0b1220;margin-top:6px;">fg-1</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#8c93a5;">#0B1220</div></div>
    <div style="text-align:center;"><div style="height:48px;background:#1c2434;border-radius:8px;"></div><div style="font:600 11px 'Inter';color:#0b1220;margin-top:6px;">fg-2</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#8c93a5;">#1C2434</div></div>
    <div style="text-align:center;"><div style="height:48px;background:#404a5e;border-radius:8px;"></div><div style="font:600 11px 'Inter';color:#0b1220;margin-top:6px;">fg-3</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#8c93a5;">#404A5E</div></div>
    <div style="text-align:center;"><div style="height:48px;background:#5d6577;border-radius:8px;"></div><div style="font:600 11px 'Inter';color:#0b1220;margin-top:6px;">fg-4</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#8c93a5;">#5D6577</div></div>
    <div style="text-align:center;"><div style="height:48px;background:#8c93a5;border-radius:8px;"></div><div style="font:600 11px 'Inter';color:#0b1220;margin-top:6px;">fg-5</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#8c93a5;">#8C93A5</div></div>
    <div style="text-align:center;"><div style="height:48px;background:#b3b9c8;border-radius:8px;"></div><div style="font:600 11px 'Inter';color:#0b1220;margin-top:6px;">fg-6</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#8c93a5;">#B3B9C8</div></div>
  </div>

  <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Dark theme</div>
  <div style="background:#0a0e16;padding:10px;border-radius:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;">
    <div style="text-align:center;"><div style="height:40px;background:#f1f4fa;border-radius:6px;"></div><div style="font:600 10px 'Inter';color:#dbe0eb;margin-top:6px;">fg-1</div></div>
    <div style="text-align:center;"><div style="height:40px;background:#dbe0eb;border-radius:6px;"></div><div style="font:600 10px 'Inter';color:#dbe0eb;margin-top:6px;">fg-2</div></div>
    <div style="text-align:center;"><div style="height:40px;background:#b8becc;border-radius:6px;"></div><div style="font:600 10px 'Inter';color:#dbe0eb;margin-top:6px;">fg-3</div></div>
    <div style="text-align:center;"><div style="height:40px;background:#8a91a4;border-radius:6px;"></div><div style="font:600 10px 'Inter';color:#dbe0eb;margin-top:6px;">fg-4</div></div>
    <div style="text-align:center;"><div style="height:40px;background:#6a7184;border-radius:6px;"></div><div style="font:600 10px 'Inter';color:#dbe0eb;margin-top:6px;">fg-5</div></div>
    <div style="text-align:center;"><div style="height:40px;background:#424a5d;border-radius:6px;"></div><div style="font:600 10px 'Inter';color:#dbe0eb;margin-top:6px;">fg-6</div></div>
  </div>
</div>
</body></html>
