<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;background:#f7f8fb;}</style>
</head>
<body>
<div class="card" style="padding:24px;background:#f7f8fb;">
  <div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap;">
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(15,22,40,0.04),0 1px 3px rgba(15,22,40,0.04);"></div>
      <div style="font:600 11px 'Inter';color:#0b1220;margin-top:8px;">shadow-1</div>
      <div style="font:10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;">cards · inputs</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(15,22,40,0.06),0 1px 3px rgba(15,22,40,0.04);"></div>
      <div style="font:600 11px 'Inter';color:#0b1220;margin-top:8px;">shadow-2</div>
      <div style="font:10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;">elevated · hover</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#fff;border-radius:14px;box-shadow:0 14px 36px rgba(15,22,40,0.12),0 2px 6px rgba(15,22,40,0.05);"></div>
      <div style="font:600 11px 'Inter';color:#0b1220;margin-top:8px;">shadow-pop</div>
      <div style="font:10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;">modal · overlay</div>
    </div>
    <div style="text-align:center;">
      <div style="width:56px;height:56px;background:#2562ee;border-radius:50%;box-shadow:0 10px 24px rgba(37,98,238,0.35),0 2px 6px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;color:#fff;font:700 28px 'Inter';">+</div>
      <div style="font:600 11px 'Inter';color:#0b1220;margin-top:8px;">FAB glow</div>
      <div style="font:10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;">primary-tinted</div>
    </div>
  </div>
</div>
</body></html>
