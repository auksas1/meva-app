<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:18px 20px;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div>
      <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Light</div>
      <div style="background:#f7f8fb;border:1px solid #e6e9f0;border-radius:14px;padding:14px;">
        <div style="background:#fff;border:1px solid #e6e9f0;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font:600 12px 'Inter';color:#0b1220;">surface-1</span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5d6577;">#FFF</span>
        </div>
        <div style="background:#f1f3f8;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;">
          <span style="font:600 12px 'Inter';color:#0b1220;">surface-2</span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5d6577;">#F1F3F8</span>
        </div>
        <div style="background:#e8ecf3;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;">
          <span style="font:600 12px 'Inter';color:#0b1220;">surface-3</span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5d6577;">#E8ECF3</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:6px 4px;">
          <span style="font:600 11px 'Inter';color:#0b1220;">hairline</span>
          <span style="flex:1;height:1px;background:#e6e9f0;margin:0 12px;"></span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5d6577;">#E6E9F0</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px;">
          <span style="font:600 11px 'Inter';color:#0b1220;">border</span>
          <span style="flex:1;height:1px;background:#d9dde6;margin:0 12px;"></span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5d6577;">#D9DDE6</span>
        </div>
      </div>
    </div>
    <div>
      <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Dark</div>
      <div style="background:#0a0e16;border-radius:14px;padding:14px;">
        <div style="background:#121823;border:1px solid #232b3a;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font:600 12px 'Inter';color:#f1f4fa;">surface-1</span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8a91a4;">#121823</span>
        </div>
        <div style="background:#1a2230;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;">
          <span style="font:600 12px 'Inter';color:#f1f4fa;">surface-2</span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8a91a4;">#1A2230</span>
        </div>
        <div style="background:#232b3b;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;">
          <span style="font:600 12px 'Inter';color:#f1f4fa;">surface-3</span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8a91a4;">#232B3B</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:6px 4px;">
          <span style="font:600 11px 'Inter';color:#dbe0eb;">hairline</span>
          <span style="flex:1;height:1px;background:#232b3a;margin:0 12px;"></span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8a91a4;">#232B3A</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px;">
          <span style="font:600 11px 'Inter';color:#dbe0eb;">border</span>
          <span style="flex:1;height:1px;background:#2c3447;margin:0 12px;"></span>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8a91a4;">#2C3447</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
