<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { font-family: "Inter", -apple-system, sans-serif; }
  .sw { display:flex;flex-direction:column;background:#fff;border:1px solid #e6e9f0;border-radius:14px;overflow:hidden; }
  .sw .fill { height:56px; }
  .sw .body { padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline; }
  .sw .name { font-weight:600;font-size:12px;color:#0b1220; }
  .sw .role { font-size:10px;color:#8c93a5;text-transform:uppercase;letter-spacing:.06em; }
  .sw .hex { font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5d6577; }
</style></head>
<body>
<div class="card" style="padding:18px 20px;">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
    <div class="sw"><div class="fill" style="background:#22c55e;"></div><div class="body"><div><div class="name">success</div><div class="role">Minor / repaired</div></div><span class="hex">#22C55E</span></div></div>
    <div class="sw"><div class="fill" style="background:#f59e0b;"></div><div class="body"><div><div class="name">warning</div><div class="role">Moderate</div></div><span class="hex">#F59E0B</span></div></div>
    <div class="sw"><div class="fill" style="background:#ef4444;"></div><div class="body"><div><div class="name">severe</div><div class="role">Significant · destructive</div></div><span class="hex">#EF4444</span></div></div>
    <div class="sw"><div class="fill" style="background:#dcfce7;"></div><div class="body"><div><div class="name">success-soft</div><div class="role">Light bg</div></div><span class="hex">#DCFCE7</span></div></div>
    <div class="sw"><div class="fill" style="background:#fef3c7;"></div><div class="body"><div><div class="name">warning-soft</div><div class="role">Light bg</div></div><span class="hex">#FEF3C7</span></div></div>
    <div class="sw"><div class="fill" style="background:#fee2e2;"></div><div class="body"><div><div class="name">severe-soft</div><div class="role">Light bg</div></div><span class="hex">#FEE2E2</span></div></div>
  </div>
  <div style="margin-top:12px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8c93a5;">Buckets: score &lt; 0.33 → success · 0.33–0.66 → warning · ≥ 0.66 → severe</div>
</div>
</body></html>
