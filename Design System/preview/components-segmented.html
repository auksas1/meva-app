<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:20px;">
  <div style="display:flex;padding:4px;background:#f1f3f8;border-radius:12px;gap:2px;max-width:380px;">
    <div style="flex:1;padding:10px 0;text-align:center;border-radius:8px;font:600 13px 'Inter';color:#5d6577;">Low</div>
    <div style="flex:1;padding:10px 0;text-align:center;border-radius:8px;background:#fff;color:#0b1220;font:600 13px 'Inter';box-shadow:0 1px 2px rgba(15,22,40,0.06);">Medium</div>
    <div style="flex:1;padding:10px 0;text-align:center;border-radius:8px;font:600 13px 'Inter';color:#5d6577;">High</div>
  </div>
  <div style="font:11px 'Inter';color:#8c93a5;margin-top:10px;">Pill segmented · selected = elevated white tile on inset gray track</div>
</div>
</body></html>
