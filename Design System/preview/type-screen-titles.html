<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style> body{font-family:"Inter",-apple-system,sans-serif;color:#0b1220;} </style>
</head>
<body>
<div class="card" style="padding:20px 24px;">
  <div style="display:grid;grid-template-columns:1fr auto;gap:24px;align-items:flex-start;">
    <div>
      <div style="font-size:11px;font-weight:600;color:#8c93a5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Analyze · AI vehicle inspection</div>
      <div style="font:700 24px/1.15 'Inter';letter-spacing:-0.015em;color:#0b1220;margin:0;">Take a photo</div>
      <div style="font:400 15px/1.5 'Inter';color:#404a5e;margin-top:6px;max-width:340px;">Capture the damaged area — we'll detect zones, parts and an estimated repair cost.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8c93a5;text-align:right;white-space:nowrap;">
      <span><b style="color:#0b1220;">title</b> 24 / 700 / -1.5%</span>
      <span><b style="color:#0b1220;">body</b> 15 / 400 / 1.5lh</span>
      <span><b style="color:#0b1220;">overline</b> 11 / 600 / +8%</span>
      <span>Inter · variable</span>
    </div>
  </div>
</div>
</body></html>
