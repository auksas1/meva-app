<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:"Inter",-apple-system,sans-serif;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font:600 15px "Inter";cursor:pointer;padding:12px 18px;min-height:48px;border:0;}
  .lbl{font:600 10px "Inter";color:#8c93a5;margin-top:8px;text-align:center;text-transform:uppercase;letter-spacing:.06em;}
</style></head>
<body>
<div class="card" style="padding:20px;">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
    <div>
      <button class="btn" style="background:#2562ee;color:#fff;width:100%;box-shadow:0 4px 14px rgba(37,98,238,0.25);">Primary</button>
      <div class="lbl">Primary</div>
    </div>
    <div>
      <button class="btn" style="background:transparent;color:#1c2434;border:1px solid #d9dde6;width:100%;">Secondary</button>
      <div class="lbl">Outlined</div>
    </div>
    <div>
      <button class="btn" style="background:transparent;color:#ef4444;border:1px solid #ef4444;width:100%;">Sign out</button>
      <div class="lbl">Danger</div>
    </div>
    <div>
      <button class="btn" style="background:#f1f3f8;color:#8c93a5;width:100%;cursor:not-allowed;">Submit</button>
      <div class="lbl">Disabled</div>
    </div>
  </div>
</div>
</body></html>
