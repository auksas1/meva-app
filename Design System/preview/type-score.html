<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:20px;">
  <div style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;">
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span style="font:800 32px 'Inter';color:#22c55e;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;">22%</span>
      <span style="display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#22c55e;padding:4px 10px;border-radius:999px;font:600 11px 'Inter';text-transform:uppercase;letter-spacing:.04em;"><span style="width:6px;height:6px;border-radius:3px;background:#22c55e;"></span>Minor</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span style="font:800 32px 'Inter';color:#f59e0b;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;">54%</span>
      <span style="display:inline-flex;align-items:center;gap:6px;background:#fef3c7;color:#f59e0b;padding:4px 10px;border-radius:999px;font:600 11px 'Inter';text-transform:uppercase;letter-spacing:.04em;"><span style="width:6px;height:6px;border-radius:3px;background:#f59e0b;"></span>Moderate</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span style="font:800 32px 'Inter';color:#ef4444;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;">81%</span>
      <span style="display:inline-flex;align-items:center;gap:6px;background:#fee2e2;color:#ef4444;padding:4px 10px;border-radius:999px;font:600 11px 'Inter';text-transform:uppercase;letter-spacing:.04em;"><span style="width:6px;height:6px;border-radius:3px;background:#ef4444;"></span>Significant</span>
    </div>
  </div>
  <div style="font:11px 'Inter';color:#8c93a5;margin-top:14px;font-family:ui-monospace,Menlo,monospace;">Score percent: 32 / 800 / tabular-nums + StatusBadge pill</div>
</div>
</body></html>
