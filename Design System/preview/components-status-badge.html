<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;}
.b { display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 11px "Inter";text-transform:uppercase;letter-spacing:.04em; }
.b .d { width:6px;height:6px;border-radius:3px; }
</style></head>
<body>
<div class="card" style="padding:20px;">
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <span class="b" style="background:#dcfce7;color:#22c55e;"><span class="d" style="background:#22c55e;"></span>Minor</span>
    <span class="b" style="background:#fef3c7;color:#f59e0b;"><span class="d" style="background:#f59e0b;"></span>Moderate</span>
    <span class="b" style="background:#fee2e2;color:#ef4444;"><span class="d" style="background:#ef4444;"></span>Significant</span>
    <span class="b" style="background:#eef3ff;color:#1d4ed8;"><span class="d" style="background:#2562ee;"></span>Repaired</span>
    <span class="b" style="background:#f1f3f8;color:#5d6577;"><span class="d" style="background:#5d6577;"></span>Pending</span>
  </div>
  <div style="font:11px 'Inter';color:#8c93a5;margin-top:12px;font-family:ui-monospace,Menlo,monospace;">StatusBadge · score-bucketed color + soft fill + dot</div>
</div>
</body></html>
