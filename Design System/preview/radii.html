<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:20px 24px;">
  <div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;">
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#2562ee;border-radius:8px;box-shadow:0 6px 14px rgba(37,98,238,0.25);"></div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#0b1220;margin-top:8px;font-weight:600;">8px</div>
      <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;">chips · pills</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#2562ee;border-radius:12px;box-shadow:0 6px 14px rgba(37,98,238,0.25);"></div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#0b1220;margin-top:8px;font-weight:600;">12px</div>
      <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;">buttons · inputs</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#2562ee;border-radius:16px;box-shadow:0 6px 14px rgba(37,98,238,0.25);"></div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#0b1220;margin-top:8px;font-weight:600;">16px</div>
      <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;">cards · panels</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#2562ee;border-radius:20px;box-shadow:0 6px 14px rgba(37,98,238,0.25);"></div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#0b1220;margin-top:8px;font-weight:600;">20px</div>
      <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;">hero · scan tile</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#2562ee;border-radius:999px;box-shadow:0 6px 14px rgba(37,98,238,0.25);"></div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#0b1220;margin-top:8px;font-weight:600;">pill / 999</div>
      <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;">badges · FAB</div>
    </div>
  </div>
</div>
</body></html>
