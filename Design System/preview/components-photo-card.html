<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:18px 20px;">
  <div style="background:#fff;border:1px solid #e6e9f0;border-radius:16px;padding:12px;max-width:480px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(15,22,40,0.04);">
    <div style="position:relative;flex:0 0 auto;">
      <div style="width:76px;height:76px;border-radius:12px;background:linear-gradient(135deg,#cfd8dc,#546e7a);"></div>
      <div style="position:absolute;bottom:6px;left:6px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,0.7);color:#fff;font:700 11px 'Inter';font-variant-numeric:tabular-nums;backdrop-filter:blur(4px);">72%</div>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <div style="font:600 15px 'Inter';color:#0b1220;">Photo 1</div>
        <span style="display:inline-flex;align-items:center;gap:6px;background:#fee2e2;color:#ef4444;padding:4px 10px;border-radius:999px;font:600 11px 'Inter';text-transform:uppercase;letter-spacing:.04em;"><span style="width:6px;height:6px;border-radius:3px;background:#ef4444;"></span>Significant</span>
      </div>
      <div style="font:13px 'Inter';color:#5d6577;">2 zones · 2 parts · €600</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8c93a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </div>
</div>
</body></html>
