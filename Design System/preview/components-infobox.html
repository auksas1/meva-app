<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:20px;">
  <div style="background:#fff;border:1px solid #e6e9f0;border-radius:16px;padding:20px;max-width:500px;box-shadow:0 4px 14px rgba(15,22,40,0.06);">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <div style="width:24px;height:24px;border-radius:12px;background:#dcfce7;color:#22c55e;display:flex;align-items:center;justify-content:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 8"/></svg>
      </div>
      <span style="font:700 11px 'Inter';color:#22c55e;text-transform:uppercase;letter-spacing:.08em;">Analysis complete</span>
    </div>
    <div style="font:500 12px 'Inter';color:#8c93a5;margin-bottom:4px;">Estimated total</div>
    <div style="font:800 36px/1 'Inter';color:#0b1220;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">€600</div>
    <div style="display:flex;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid #e6e9f0;">
      <div style="flex:1;">
        <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Photos</div>
        <div style="font:700 16px 'Inter';color:#0b1220;">2</div>
      </div>
      <div style="flex:1;">
        <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Damages</div>
        <div style="font:700 16px 'Inter';color:#0b1220;">3</div>
      </div>
      <div style="flex:1;">
        <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Severity</div>
        <div style="display:inline-flex;align-items:center;gap:6px;background:#fee2e2;color:#ef4444;padding:4px 10px;border-radius:999px;font:600 11px 'Inter';text-transform:uppercase;letter-spacing:.04em;"><span style="width:6px;height:6px;border-radius:3px;background:#ef4444;"></span>Significant</div>
      </div>
    </div>
  </div>
  <div style="font:11px 'Inter';color:#8c93a5;margin-top:10px;font-family:ui-monospace,Menlo,monospace;">Summary card · large KPI + status-block trio</div>
</div>
</body></html>
