<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:18px 20px;">
  <div style="background:#fff;border:1px solid #e6e9f0;border-radius:16px;padding:14px;max-width:500px;box-shadow:0 1px 3px rgba(15,22,40,0.04);">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
      <div style="flex:1;">
        <div style="font:600 15px 'Inter';color:#0b1220;">BodyShop GmbH</div>
        <div style="font:12px 'Inter';color:#8c93a5;margin-top:2px;">May 12, 2026</div>
        <div style="font:13px 'Inter';color:#404a5e;margin-top:10px;line-height:1.5;">Replaced front bumper, repainted hood section.</div>
      </div>
      <div style="text-align:right;">
        <div style="font:600 10px 'Inter';color:#8c93a5;text-transform:uppercase;letter-spacing:.06em;">Spent</div>
        <div style="font:700 18px 'Inter';color:#22c55e;font-variant-numeric:tabular-nums;margin-top:2px;">€420</div>
      </div>
    </div>
    <div style="display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid #e6e9f0;">
      <button style="background:none;border:0;padding:0;cursor:pointer;font:600 14px 'Inter';color:#2562ee;">Edit</button>
      <button style="background:none;border:0;padding:0;cursor:pointer;font:600 14px 'Inter';color:#ef4444;">Delete</button>
    </div>
  </div>
</div>
</body></html>
