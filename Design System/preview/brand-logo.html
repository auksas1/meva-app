<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <img src="../assets/logo-mark.svg" width="72" height="72" alt="">
      <div style="font:600 10px var(--meva-font-family);color:#888;text-transform:uppercase;letter-spacing:.06em;">App icon</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:240px;">
      <img src="../assets/logo-wordmark.svg" width="280" alt="">
      <div style="font:600 10px var(--meva-font-family);color:#888;text-transform:uppercase;letter-spacing:.06em;">Wordmark · light bg</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="background:#0e1117;padding:14px 20px;border-radius:8px;">
        <img src="../assets/logo-wordmark.svg" width="200" alt="" style="filter:brightness(0) invert(1);">
      </div>
      <div style="font:600 10px var(--meva-font-family);color:#888;text-transform:uppercase;letter-spacing:.06em;">Inverse</div>
    </div>

  </div>
  <div class="mono" style="font-size:11px;color:#888;margin-top:14px;">
    Two-tone "AutoDamage" wordmark + "AD" monogram tile. ⚠ Substituted — codebase has only the Expo template icon.
  </div>
</div>
</body></html>
