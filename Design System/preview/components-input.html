<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:"Inter",-apple-system,sans-serif;}</style>
</head>
<body>
<div class="card" style="padding:18px 20px;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
    <div>
      <div style="font:600 13px 'Inter';color:#1c2434;margin-bottom:6px;">Email</div>
      <input value="alex@example.com" style="width:100%;border:1px solid #2562ee;border-radius:12px;padding:14px;font:15px 'Inter';color:#0b1220;background:#fff;outline:none;box-shadow:0 0 0 3px #eef3ff;box-sizing:border-box;">
      <div style="font:11px 'Inter';color:#8c93a5;margin-top:6px;">Focused state · primary ring</div>
    </div>
    <div>
      <div style="font:600 13px 'Inter';color:#1c2434;margin-bottom:6px;">Password</div>
      <input value="••••••••" style="width:100%;border:1px solid #d9dde6;border-radius:12px;padding:14px;font:15px 'Inter';color:#0b1220;background:#fff;outline:none;letter-spacing:.15em;box-sizing:border-box;">
      <div style="font:11px 'Inter';color:#ef4444;margin-top:6px;font-weight:600;">Passwords do not match.</div>
    </div>
  </div>
</div>
</body></html>
